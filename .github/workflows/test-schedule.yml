
name: Test del programador GitHub Actions

on:
  schedule:
    - cron: "*/5 * * * *"
      timezone: "America/Lima"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  comprobar:
    runs-on: ubuntu-latest

    steps:
      - name: Confirmar ejecución automática
        run: |
          echo "El programador de GitHub funciona"
          echo "Evento: $GITHUB_EVENT_NAME"
          echo "Fecha UTC: $(date -u)"
          echo "Fecha Lima: $(TZ=America/Lima date)"
