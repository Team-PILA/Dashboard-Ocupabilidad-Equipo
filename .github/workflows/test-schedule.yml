
name: Test del programador GitHub Actions

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  comprobar:
    runs-on: ubuntu-latest

    steps:
      - name: Confirmar ejecución
        run: |
          echo "El workflow se ha ejecutado"
          echo "Evento: $GITHUB_EVENT_NAME"
          echo "Fecha UTC: $(date -u)"
          echo "Fecha Lima: $(TZ=America/Lima date)"
